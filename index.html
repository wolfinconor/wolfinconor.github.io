<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Conor Wolfin</title>
  <style>
    :root {
      --bg: #0f1115;
      --fg: #f4f4f5;
      --accent: #6ee7b7;
      --muted: #9ca3af;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--bg);
      color: var(--fg);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      text-align: center;
      padding: 2rem;
    }
    .card {
      max-width: 32rem;
    }
    h1 {
      font-size: clamp(2rem, 5vw, 3rem);
      margin-bottom: 0.5rem;
    }
    p {
      color: var(--muted);
      font-size: 1.1rem;
      line-height: 1.6;
    }
    .accent {
      color: var(--accent);
    }
    .tag {
      display: inline-block;
      font-size: 0.8rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--accent);
      border: 1px solid #2a2d34;
      border-radius: 999px;
      padding: 0.3rem 0.9rem;
      margin-bottom: 1.25rem;
    }
    .links {
      margin-top: 2rem;
      display: flex;
      gap: 1.5rem;
      justify-content: center;
    }
    .links a {
      color: var(--fg);
      text-decoration: none;
      border: 1px solid #2a2d34;
      padding: 0.6rem 1.2rem;
      border-radius: 999px;
      transition: border-color 0.2s ease;
    }
    .links a:hover {
      border-color: var(--accent);
    }
  </style>
</head>
<body>
  <div class="card">
    <span class="tag">Under construction</span>
    <h1>Conor <span class="accent">Wolfin</span></h1>
    <p>Welcome to my landing page. More coming soon.</p>
    <div class="links">
      <a href="https://github.com/wolfinconor" target="_blank" rel="noopener">GitHub</a>
      <a href="mailto:conorwolfin@gmail.com">Email</a>
    </div>
  </div>
</body>
</html>
